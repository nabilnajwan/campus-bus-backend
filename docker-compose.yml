version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: campus-bus-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      # We will use an init script to create the multiple databases
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql

volumes:
  postgres-data:
