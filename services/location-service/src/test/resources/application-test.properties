spring.application.name=location-service
spring.profiles.active=test

# Database configuration (test profile)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server configuration
server.port=8083
server.servlet.context-path=/

# Logging
logging.level.root=INFO
logging.level.com.sanrio.locationservice=DEBUG
logging.level.org.springframework.security=DEBUG

# JWT Configuration (test values)
jwt.secret=test-secret-key-for-testing-purposes-only-do-not-use-in-production
jwt.expiration=3600000

# Trip Service URL (test mock)
services.trip-service.url=http://localhost:8081

# SSL/TLS (disable for test)
server.ssl.enabled=false
